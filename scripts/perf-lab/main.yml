# Lab workflow. Shared measurements are in benchmarks.yml.
name: spring-quarkus-perf-comparison
hosts:
  target-host: ${{env.run.host.target}}

roles:
  test-runner:
    hosts:
      - target-host
    setup-scripts:
      - update-state
      - cleanup-env
      - config-env
#      - output-vars
      - detect-os
      - capture-system-info
      - ensure-requirements
      - clone-repo
      - ensure-container-runtime
      - capture-repo-info
      - stop-test-services
      - start-timestamp
    run-scripts:
      - run-tests
    cleanup-scripts:
      - stop-timestamp
      - download-metrics
      - stop-test-services
      - cleanup-env
